[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imax-watcher"
version = "1.0.0"
description = "Get alerted the moment IMAX/movie showtimes appear near you. Runs free on GitHub Actions, or locally as a CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jashanveer Singh" }]
keywords = ["imax", "fandango", "tickets", "showtimes", "playwright", "automation"]
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Jashanveer/imax-watcher"
Issues = "https://github.com/Jashanveer/imax-watcher/issues"

[project.scripts]
imax-watcher = "watcher:main"

[tool.setuptools]
py-modules = ["watcher"]
